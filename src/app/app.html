<main>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">
    <img src="/imagenes/logo.png" alt="Logo" height="40">
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Ver todas</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Realizar pedido</a>
        </li>

      </ul>
      <form class="d-flex" role="search">
        <input class="form-control me-2" type="search" placeholder="Buscar..." aria-label="Search">
        <button class="btn btn-outline-primary" type="submit">Buscar</button>
      </form>
    </div>
  </div>
</nav>

<div class="container text-center mt-4">
  <div class="row align-items-stretch g-4"> 
    
    @for (item of listaPizzas; track item.id) {
      <div class="col-12 col-md-6 col-lg-3 d-flex">
        <app-card-pizza [pizza]="item" class="w-100 d-flex"></app-card-pizza>
      </div>
    }

  </div>
</div>


<div class="container mt-4 bg-light p-4 rounded shadow-sm">
  <div class="row">
    <div class="col-md-6">
      <h2>Formulario de contacto</h2>
      <p>Por favor, rellena el siguiente formulario para ponerte en contacto con nosotros.</p>
    </div>
    <form class="row g-3">
  <div class="col-12">
    <label for="inputAddress" class="form-label">Dirección</label>
    <input type="text" class="form-control" id="inputAddress" placeholder="1234 Main St">
  </div>
  <div class="col-12">
    <label for="inputAddress2" class="form-label">Dirección 2</label>
    <input type="text" class="form-control" id="inputAddress2" placeholder="Apartamento, estudio o piso">
  </div>
  <div class="col-md-6">
    <label for="inputCity" class="form-label">Ciudad</label>
    <input type="text" class="form-control" id="inputCity">
  </div>
  <div class="col-md-4">
    <label for="inputState" class="form-label">Provincia</label>
    <select id="inputState" class="form-select">
      <option selected>Elige una opción</option>
      <option>...</option>
    </select>
  </div>
  <div class="col-md-2">
    <label for="inputZip" class="form-label">Código postal</label>
    <input type="text" class="form-control" id="inputZip">
  </div>
 <div class="form-check">
  <input class="form-check-input" type="radio" name="flexRadioDefault" id="radioBizum" (change)="tipoPago = 'bizum'">
  <label class="form-check-label" for="radioBizum">
    Pago con Bizum
  </label>
</div>
<div class="form-check">
  <input class="form-check-input" type="radio" name="flexRadioDefault" id="radioTarjeta" checked (change)="tipoPago = 'tarjeta'">
  <label class="form-check-label" for="radioTarjeta">
    Pago con Tarjeta
  </label>
</div>
  <div class="col-12">
    <button type="submit" class="btn btn-primary">Enviar</button>
  </div>
  @if (tipoPago === 'bizum'){
 <input type="text" placeholder="Introduce tu teléfono">
  }
  @if (tipoPago === 'tarjeta'){
<input type="text" placeholder="Introduce tu número de tarjeta">
  }
</form>
  </div>
</div>

</main>
